name: linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  vanilla-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update -qq > /dev/null
        sudo apt-get install -qq -y libsdl2-dev libopenal-dev ninja-build > /dev/null

    - name: Build komkommer
      env:
        VC_CXX_FLAGS: "-w;-Wwrite-strings;-Werror=write-strings"
      run: |
        cmake --workflow --preset release

    - name: Create archives
      run: |
        strip --strip-all ./build/release/RelWithDebInfo/komkommertd
        strip --strip-all ./build/release/RelWithDebInfo/komkommerra
        mkdir artifact
        7z a artifact/komkommer-linux-x64.zip ./build/release/RelWithDebInfo/komkommertd ./build/release/RelWithDebInfo/komkommerra

    - name: Upload tagged release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifact/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
