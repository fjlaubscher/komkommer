name: linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  vanilla-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update -qq > /dev/null
        sudo apt-get install -qq -y libsdl2-dev libopenal-dev librsvg2-bin > /dev/null

    - name: Build komkommer
      env:
        VC_CXX_FLAGS: "-w;-Wwrite-strings;-Werror=write-strings"
      run: |
        ninja --version
        cmake --workflow --preset release

    - name: Package AppImages
      run: bash scripts/package-linux.sh build/release/RelWithDebInfo artifact

    - name: Upload tagged release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifact/*.AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
