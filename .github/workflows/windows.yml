name: windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  remaster_msvc:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 0

    - uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: x86

    - name: Install Dependencies
      run: |
        Invoke-WebRequest -Uri https://github.com/ninja-build/ninja/releases/download/v1.10.1/ninja-win.zip -OutFile $Env:TEMP\ninja-win.zip
        Expand-Archive $Env:TEMP\ninja-win.zip -DestinationPath $Env:TEMP\ninja
        echo "$Env:TEMP\ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        ninja --version

    - name: Build komkommer
      env:
        VC_CXX_FLAGS: "/Zc:strictStrings;-wd4244;-wd4018;-wd4291;-wd4101;-wd4267;-wd4200"
      run: |
        cmake --workflow --preset remaster

    - name: Create archives
      shell: bash
      run: |
        mkdir artifact
        7z a artifact/komkommer-remaster-td.zip ./build/remaster/komkommer_TD
        7z a artifact/komkommer-remaster-ra.zip ./build/remaster/komkommer_RA

    - name: Upload tagged release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifact/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vanilla_win_msvc:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 0

    - uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: x64

    - name: Install Dependencies
      id: deps
      run: |
        Invoke-WebRequest -Uri https://www.libsdl.org/release/SDL2-devel-2.0.12-VC.zip -OutFile SDL2-devel.zip
        Invoke-WebRequest -Uri https://github.com/ninja-build/ninja/releases/download/v1.10.1/ninja-win.zip -OutFile $Env:TEMP\ninja-win.zip
        Invoke-WebRequest -SkipCertificateCheck -Uri https://openal-soft.org/openal-binaries/openal-soft-1.21.0-bin.zip -OutFile openal-soft-1.21.0-bin.zip
        Expand-Archive SDL2-devel.zip -DestinationPath .
        Expand-Archive $Env:TEMP\ninja-win.zip -DestinationPath $Env:TEMP\ninja
        Expand-Archive openal-soft-1.21.0-bin.zip -DestinationPath .
        echo "$Env:TEMP\ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        ninja --version
        echo "magickpath=$(Split-Path -Path $(Get-Command magick).Path -Parent)" >> $env:GITHUB_OUTPUT
        Rename-Item openal-soft-1.21.0-bin\bin\Win64\soft_oal.dll OpenAL32.dll

    - name: Build komkommer
      env:
        CMAKE_FIND_ROOT_PATH: "SDL2-2.0.12;openal-soft-1.21.0-bin;${{ steps.deps.outputs.magickpath }}"
        VC_CXX_FLAGS: "/Zc:strictStrings;-wd4244;-wd4018;-wd4291;-wd4101;-wd4267;-wd4200"
      run: |
        New-Item -Path "build/release/RelWithDebInfo" -ItemType Directory
        Copy-Item -Path "SDL2-2.0.12\lib\x64\SDL2.dll" -Destination build/release/RelWithDebInfo
        cmake --workflow --preset release

    - name: Create archives
      shell: bash
      run: |
        mkdir artifact
        7z a artifact/komkommer-windows-x64.zip ./build/release/RelWithDebInfo/komkommertd.exe ./build/release/RelWithDebInfo/komkommerra.exe ./SDL2-2.0.12/lib/x64/SDL2.dll ./openal-soft-1.21.0-bin/bin/Win64/OpenAL32.dll

    - name: Upload tagged release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifact/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
