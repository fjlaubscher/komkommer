name: macos

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  vanilla-macos:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 0

    - name: Setting up Cache-Key
      run: echo "DEP_CACHE_KEY=arm64-$(curl 'https://ports.macports.org/api/v1/ports/dylibbundler/?format=json' | grep -ioE '("version":).[^,]*')-$(curl 'https://ports.macports.org/api/v1/ports/libsdl2/?format=json' | grep -ioE '("version":).[^,]*')-$(curl 'https://ports.macports.org/api/v1/ports/openal-soft/?format=json' | grep -ioE '("version":).[^,]*')" >> $GITHUB_ENV

    - name: Printing Cache-Key
      run: echo $DEP_CACHE_KEY

    - name: Restore cache
      id: dep-cache
      uses: actions/cache@v4
      env:
        cache-name: cache-dependencies
      with:
        path: ~/macports
        key: ${{ env.DEP_CACHE_KEY }}

    - name: Install homebrew deps
      run: |
        brew install imagemagick dylibbundler

    - if: ${{ steps.dep-cache.outputs.cache-hit != 'true' }}
      name: Install macport dependencies
      run: |
        wget -q https://github.com/macports/macports-base/releases/download/v2.10.5/MacPorts-2.10.5-14-Sonoma.pkg
        sudo installer -pkg ./MacPorts-2.10.5-14-Sonoma.pkg -target /
        export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
        sudo port selfupdate -N
        sudo port install libsdl2 -N
        sudo port install openal-soft -N
        mkdir ~/macports
        sudo cp -R /opt/local ~/macports
        sudo chown -R $USER:staff ~/macports

    - if: ${{ steps.dep-cache.outputs.cache-hit == 'true' }}
      name: Restore macport dependencies from cache
      run: |
        sudo cp -R ~/macports/local /opt/local

    - name: Build komkommer
      env:
        CMAKE_OSX_ARCHITECTURES: "arm64"
        VC_CXX_FLAGS: "-w;-Wwrite-strings;-Werror=write-strings"
      run: |
        export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
        cmake --workflow --preset release

    - name: Create archives
      env:
        APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      run: |
        strip -Sx build/release/RelWithDebInfo/komkommertd.app/Contents/MacOS/komkommertd
        strip -Sx build/release/RelWithDebInfo/komkommerra.app/Contents/MacOS/komkommerra
        dylibbundler --create-dir --bundle-deps --overwrite-files --dest-dir ./build/release/RelWithDebInfo/komkommertd.app/Contents/libs --fix-file build/release/RelWithDebInfo/komkommertd.app/Contents/MacOS/komkommertd
        dylibbundler --create-dir --bundle-deps --overwrite-files --dest-dir ./build/release/RelWithDebInfo/komkommerra.app/Contents/libs --fix-file build/release/RelWithDebInfo/komkommerra.app/Contents/MacOS/komkommerra
        bash .github/scripts/sign-macos-app.sh \
          build/release/RelWithDebInfo/komkommertd.app \
          build/release/RelWithDebInfo/komkommerra.app
        mkdir artifact
        7z a artifact/komkommer-macos-arm64.zip ./build/release/RelWithDebInfo/komkommertd.app ./build/release/RelWithDebInfo/komkommerra.app

    - name: Upload tagged release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifact/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
